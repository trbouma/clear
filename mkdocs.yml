site_name: Clear
site_description: "Digital minting infrastructure for issuer-defined treasury units: authorized, redeemable, private Mint Notes."
site_url: https://trbouma.github.io/clear/
repo_url: https://github.com/trbouma/clear
repo_name: trbouma/clear

docs_dir: website
site_dir: site

theme:
  name: material
  language: en
  logo: assets/clear-logo.svg
  favicon: assets/clear-logo.svg
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Understand Clear:
      - Why Clear?: why-clear.md
      - Organization-Issued Value: organization-issued-value.md
      - Mint Notes and CMU: mint-notes.md
      - Transferability and Acceptance: transferability.md
      - Unit and Currency Model: currency-model.md
      - How Clear Is Governed: governance.md
      - Protocol Model: protocol-model.md
      - CMU Transfer Requests: payment-requests.md
      - Product Family: product-family.md
  - Policy Briefs:
      - Overview: policy-briefs/index.md
      - Old Function, New Tools: policy-briefs/old-function-new-tools.md
      - Embracing an Older Pattern: policy-briefs/coinage-and-clear.md
      - Credit, Coinage and Clear: policy-briefs/credit-coinage-and-clear.md
      - Goldsmiths and Clear: policy-briefs/goldsmiths-and-clear.md
      - MintChip and Clear: policy-briefs/mintchip-and-clear.md
      - Cashu, Decoupled: policy-briefs/cashu-decoupled.md
      - Clear Is Not a Stablecoin: policy-briefs/chaumian-mint-vs-stablecoins.md
      - Hidden Complexity and Clear: policy-briefs/hidden-complexity-and-clear.md
      - Clearing Is More Than Minting: policy-briefs/clearing-is-more-than-minting.md
      - Clear Warehouse Units: policy-briefs/clear-warehouse-units.md
      - QxVault and Clear: policy-briefs/qxvault-and-clear.md
  - Operate Clear:
      - Getting Started: getting-started.md
      - Standalone Deployment: deployment.md
      - Commissioning a Mint: root-commissioning.md
      - Onboarding a Treasurer: treasurer-onboarding.md
      - API: api.md
      - Security: security.md
      - Release Roadmap: release-roadmap.md
  - Workshops:
      - Clear Intro Workshop: presentations/clear-intro/index.html
  - Project Status: project-status.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Clear is open-source software released under the MIT License.
