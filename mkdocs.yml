site_name: Clear
site_description: Organization-defined Mint Notes with explicit issuance, redemption, and retirement.
site_url: https://trbouma.github.io/clear/
repo_url: https://github.com/trbouma/clear
repo_name: trbouma/clear

docs_dir: website
site_dir: site

theme:
  name: material
  language: en
  logo: assets/clear-logo.svg
  favicon: assets/clear-logo.svg
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Understand Clear:
      - Why Clear?: why-clear.md
      - Organization-Issued Value: organization-issued-value.md
      - Mint Notes and CMU: mint-notes.md
      - Currency Model: currency-model.md
      - How Clear Is Governed: governance.md
      - Old Function, New Tools: old-function-new-tools.md
      - Protocol Model: protocol-model.md
      - CMU Transfer Requests: payment-requests.md
      - Product Family: product-family.md
  - Operate Clear:
      - Getting Started: getting-started.md
      - API: api.md
      - Security: security.md
      - Release Roadmap: release-roadmap.md
  - Project Status: project-status.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Clear is open-source software released under the MIT License.
