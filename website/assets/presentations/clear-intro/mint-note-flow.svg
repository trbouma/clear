<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Mint Note lifecycle</title>
  <desc id="desc">Treasurer issuance, holder circulation, and redemption or retirement as a loop.</desc>
  <defs>
    <style>
      .bg{fill:#f6faf9}.node{fill:#fff;stroke:#d5e3e3;stroke-width:3}.mint{fill:#eaf6f7;stroke:#247c93;stroke-width:4}.text{font-family:Inter,Arial,sans-serif;fill:#17313a}.title{font-size:40px;font-weight:850}.label{font-size:27px;font-weight:820}.small{font-size:19px}.muted{fill:#63777d}.line{stroke:#247c93;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.coral{stroke:#d9674b}.coin{fill:#d9674b}.coin2{fill:#247c93}
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1 1l11 5.5L1 12z" fill="#247c93"/>
    </marker>
    <marker id="arrow2" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1 1l11 5.5L1 12z" fill="#d9674b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="text title" x="64" y="78">Mint Notes move; supply accounting stays anchored</text>
  <text class="text small muted" x="64" y="112">The mint prevents double-spending without becoming the holder account system.</text>

  <rect class="node" x="72" y="255" width="255" height="145" rx="8"/>
  <text class="text label" x="112" y="310">Treasurer</text>
  <text class="text small" x="112" y="349">authorizes issuance</text>
  <circle class="coin" cx="268" cy="325" r="23"/>

  <rect class="mint" x="472" y="230" width="260" height="190" rx="12"/>
  <text class="text label" x="540" y="300">Clear mint</text>
  <text class="text small" x="510" y="340">signs blinded outputs</text>
  <text class="text small" x="510" y="372">tracks spent proofs</text>

  <rect class="node" x="875" y="170" width="255" height="145" rx="8"/>
  <text class="text label" x="927" y="225">Holders</text>
  <text class="text small" x="927" y="264">circulate Mint Notes</text>
  <circle class="coin2" cx="1073" cy="240" r="23"/>

  <rect class="node" x="875" y="438" width="255" height="145" rx="8"/>
  <text class="text label" x="918" y="493">Redemption</text>
  <text class="text small" x="918" y="532">accepted under policy</text>
  <circle class="coin" cx="1073" cy="508" r="23"/>

  <path class="line" marker-end="url(#arrow)" d="M327 327h135"/>
  <path class="line" marker-end="url(#arrow)" d="M732 286c62-42 102-51 132-50"/>
  <path class="line" marker-end="url(#arrow)" d="M1002 315v111"/>
  <path class="line coral" marker-end="url(#arrow2)" d="M875 512c-102 20-198-10-237-84"/>
  <text class="text small muted" x="430" y="305">issue</text>
  <text class="text small muted" x="754" y="228">transfer privately</text>
  <text class="text small muted" x="692" y="500">retire spent proofs</text>
</svg>
