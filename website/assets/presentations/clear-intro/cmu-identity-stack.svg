<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Clear Mint Unit identity stack</title>
  <desc id="desc">A CMU is bound to mint URL, protocol unit, keyset ID, ledger, and policy meaning.</desc>
  <defs>
    <style>
      .bg{fill:#f6faf9}.plate{fill:#fff;stroke:#d5e3e3;stroke-width:3}.top{fill:#247c93}.coral{fill:#d9674b}.soft{fill:#eaf6f7}.text{font-family:Inter,Arial,sans-serif;fill:#17313a}.title{font-size:40px;font-weight:850}.label{font-size:27px;font-weight:820}.small{font-size:20px}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px}.muted{fill:#63777d}.line{stroke:#143d52;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="text title" x="64" y="78">A CMU is not just a label</text>
  <text class="text small muted" x="64" y="112">Friendly names help humans; exact identifiers protect accounting.</text>

  <g transform="translate(165 165)">
    <rect class="plate" x="0" y="300" width="870" height="78" rx="8"/>
    <text class="text label" x="38" y="349">issuer policy and redemption meaning</text>
    <rect class="plate" x="42" y="225" width="786" height="78" rx="8"/>
    <text class="text label" x="80" y="274">ledger boundary and spent-proof state</text>
    <rect class="plate" x="84" y="150" width="702" height="78" rx="8"/>
    <text class="text label" x="122" y="199">keyset ID</text>
    <text class="text code muted" x="315" y="200">01e1d7fa...</text>
    <rect class="plate" x="126" y="75" width="618" height="78" rx="8"/>
    <text class="text label" x="164" y="124">protocol unit</text>
    <text class="text code muted" x="395" y="125">cmu-00edb0...</text>
    <rect class="plate" x="168" y="0" width="534" height="78" rx="8"/>
    <text class="text label" x="206" y="49">mint URL</text>
    <text class="text code muted" x="360" y="50">https://...</text>
  </g>

  <rect class="soft" x="225" y="565" width="750" height="54" rx="8"/>
  <text class="text small" x="255" y="599">Wallet display can say “Food Share Credits”, but balance identity stays exact.</text>

  <circle class="coral" cx="1005" cy="250" r="52"/>
  <text class="text label" x="962" y="259" fill="#fff">CMU</text>
</svg>
