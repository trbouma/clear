<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Clear Mint Unit identity</title>
  <desc id="desc">A square CMU identity visual showing that friendly names can change while the mint route, keyset, and policy boundary remain exact.</desc>
  <defs>
    <style>
      .bg{fill:#f6faf9}
      .card{fill:#fff;stroke:#d5e3e3;stroke-width:5}
      .plate{fill:#fff;stroke:#d5e3e3;stroke-width:4}
      .top{fill:#143d52}
      .soft{fill:#eaf6f7}
      .warm{fill:#fff7f4}
      .text{font-family:Inter,Arial,sans-serif;fill:#17313a;letter-spacing:0}
      .title{font-size:31px;font-weight:950}
      .label{font-size:21px;font-weight:900}
      .small{font-size:17px;font-weight:850;fill:#63777d}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:17px;font-weight:850;fill:#63777d}
      .teal{fill:#247c93}
      .coral{fill:#d9674b}
      .white{fill:#fff}
    </style>
  </defs>

  <rect class="bg" width="560" height="560" rx="26"/>
  <rect class="card" x="52" y="46" width="456" height="468" rx="30"/>

  <rect class="top" x="82" y="78" width="396" height="78" rx="18"/>
  <text class="white title" x="280" y="127" text-anchor="middle">CMU identity</text>

  <g transform="translate(98 188)">
    <rect class="plate" width="364" height="56" rx="12"/>
    <circle class="teal" cx="34" cy="28" r="16"/>
    <text class="text label" x="64" y="36">mint route</text>
    <text class="code" x="218" y="36">https://...</text>
  </g>

  <g transform="translate(98 258)">
    <rect class="plate" width="364" height="56" rx="12"/>
    <circle class="teal" cx="34" cy="28" r="16"/>
    <text class="text label" x="64" y="36">protocol unit</text>
    <text class="code" x="218" y="36">cmu-00ed...</text>
  </g>

  <g transform="translate(98 328)">
    <rect class="plate" width="364" height="56" rx="12"/>
    <circle class="coral" cx="34" cy="28" r="16"/>
    <text class="text label" x="64" y="36">keyset</text>
    <text class="code" x="218" y="36">01e1d7...</text>
  </g>

  <g transform="translate(98 398)">
    <rect class="plate" width="364" height="56" rx="12"/>
    <circle class="coral" cx="34" cy="28" r="16"/>
    <text class="text label" x="64" y="36">policy boundary</text>
    <text class="code" x="251" y="36">exact</text>
  </g>

  <rect class="warm" x="111" y="474" width="338" height="34" rx="9"/>
  <text class="text small" x="280" y="497" text-anchor="middle">Names help humans. Identity protects accounting.</text>
</svg>
