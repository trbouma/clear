<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Mint Note as a signed secret</title>
  <desc id="desc">A tactile Mint Note visual with a hidden secret strip, a cryptographic signature seal, and subtle digital pixels.</desc>
  <defs>
    <style>
      .bg{fill:#f6faf9}
      .card{fill:#fff;stroke:#d5e3e3;stroke-width:5}
      .note{fill:#fffaf2;stroke:#d8c3a3;stroke-width:5}
      .edge{fill:#f5ead8}
      .line{stroke:#c8ad86;stroke-width:4;stroke-linecap:round}
      .fine{stroke:#d8c3a3;stroke-width:3;stroke-linecap:round}
      .secret{fill:#143d52}
      .secret-line{stroke:#eaf6f7;stroke-width:5;stroke-linecap:round}
      .teal{fill:#247c93}
      .coral{fill:#d9674b}
      .white{fill:#fff}
      .pixel{fill:#b7d8dc}
      .text{font-family:Inter,Arial,sans-serif;fill:#17313a;letter-spacing:0}
      .title{font-size:32px;font-weight:950}
      .label{font-size:21px;font-weight:900;fill:#63777d}
      .small{font-size:18px;font-weight:850;fill:#63777d}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px;font-weight:800;fill:#eaf6f7}
      .sig{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;font-weight:850;fill:#b7d8dc}
    </style>
  </defs>

  <rect class="bg" width="560" height="560" rx="26"/>
  <rect class="card" x="52" y="46" width="456" height="468" rx="30"/>

  <g transform="translate(88 115) rotate(-4 192 156)">
    <rect class="note" width="384" height="270" rx="20"/>
    <path class="edge" d="M302 0h62a20 20 0 0 1 20 20v62z"/>
    <path class="fine" d="M303 0v62h62"/>

    <text class="text title" x="46" y="67">Mint Note</text>
    <text class="text label" x="47" y="99">Private bearer instrument</text>

    <rect class="secret" x="44" y="125" width="296" height="54" rx="12"/>
    <path class="secret-line" d="M67 143h52M138 143h32M190 143h77"/>
    <path class="secret-line" d="M67 162h76M162 162h42M224 162h52"/>
    <text class="sig" x="66" y="160">sig 9f2a 71c4 e803 b65d</text>
    <text class="mono" x="64" y="203">secret: blinded + signed</text>

    <path class="line" d="M48 226h110"/>
    <path class="line" d="M184 226h72"/>
    <path class="line" d="M48 244h188"/>

    <g transform="translate(281 177)">
      <circle class="coral" cx="43" cy="43" r="38"/>
      <circle fill="#b8442e" cx="43" cy="43" r="25"/>
      <path class="white" d="M25 44l14 14 25-31 10 9-35 43-25-25z"/>
    </g>
  </g>

  <g transform="translate(112 389)">
    <rect class="pixel" x="0" y="0" width="18" height="18" rx="3"/>
    <rect class="teal" x="28" y="0" width="18" height="18" rx="3"/>
    <rect class="pixel" x="56" y="0" width="18" height="18" rx="3"/>
    <rect class="pixel" x="28" y="28" width="18" height="18" rx="3"/>
    <rect class="coral" x="56" y="28" width="18" height="18" rx="3"/>
  </g>

  <g transform="translate(372 82)">
    <rect class="pixel" x="0" y="0" width="16" height="16" rx="3"/>
    <rect class="pixel" x="24" y="24" width="16" height="16" rx="3"/>
    <rect class="teal" x="48" y="0" width="16" height="16" rx="3"/>
    <rect class="coral" x="72" y="24" width="16" height="16" rx="3"/>
  </g>

  <text class="text small" x="280" y="471" text-anchor="middle">Tangible like a note.</text>
  <text class="text small" x="280" y="498" text-anchor="middle">Secure because the secret is signed.</text>
</svg>
