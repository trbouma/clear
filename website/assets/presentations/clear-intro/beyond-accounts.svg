<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Bearer notes beyond accounts</title>
  <desc id="desc">A visual contrasting account rows with a bearer note moving privately while the mint enforces that the note can only be spent once.</desc>
  <defs>
    <style>
      .bg{fill:#f6faf9}
      .card{fill:#fff;stroke:#d5e3e3;stroke-width:5}
      .panel{fill:#fff;stroke:#d5e3e3;stroke-width:4}
      .soft{fill:#eaf6f7;stroke:#247c93;stroke-width:4}
      .warm{fill:#fff7f4;stroke:#d9674b;stroke-width:4}
      .text{font-family:Inter,Arial,sans-serif;fill:#17313a;letter-spacing:0}
      .title{font-size:27px;font-weight:950}
      .label{font-size:21px;font-weight:900}
      .small{font-size:15px;font-weight:850;fill:#63777d}
      .tiny{font-size:13px;font-weight:850;fill:#63777d}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;font-weight:850;fill:#63777d}
      .line{stroke:#247c93;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .dash{stroke:#d9674b;stroke-width:5;stroke-linecap:round;stroke-dasharray:10 12;fill:none}
      .teal{fill:#247c93}
      .deep{fill:#143d52}
      .coral{fill:#d9674b}
      .white{fill:#fff}
    </style>
  </defs>

  <rect class="bg" width="560" height="560" rx="26"/>
  <rect class="card" x="52" y="46" width="456" height="468" rx="30"/>
  <text class="text title" x="280" y="88" text-anchor="middle">Beyond accounts</text>

  <g transform="translate(88 125)">
    <rect class="panel" width="164" height="210" rx="18"/>
    <text class="text label" x="82" y="39" text-anchor="middle">Accounts</text>
    <g transform="translate(26 66)">
      <rect class="warm" width="112" height="30" rx="8"/>
      <circle class="coral" cx="18" cy="15" r="7"/>
      <text class="code" x="36" y="20">holder A</text>
    </g>
    <g transform="translate(26 106)">
      <rect class="warm" width="112" height="30" rx="8"/>
      <circle class="coral" cx="18" cy="15" r="7"/>
      <text class="code" x="36" y="20">holder B</text>
    </g>
    <g transform="translate(26 146)">
      <rect class="warm" width="112" height="30" rx="8"/>
      <circle class="coral" cx="18" cy="15" r="7"/>
      <text class="code" x="36" y="20">holder C</text>
    </g>
  </g>

  <g transform="translate(308 125)">
    <rect class="panel" width="164" height="210" rx="18"/>
    <text class="text label" x="82" y="39" text-anchor="middle">Bearer note</text>
    <rect class="soft" x="38" y="72" width="88" height="62" rx="13"/>
    <circle class="teal" cx="64" cy="103" r="18"/>
    <path class="white" d="M64 88a15 15 0 1 0 0 30v-10a5 5 0 1 1 0-10z"/>
    <path class="coral" d="M59 100h26v9H59z"/>
    <text class="code" x="82" y="163" text-anchor="middle">secret + sig</text>
  </g>

  <path class="line" d="M225 232c43-54 71-54 112 0"/>
  <path class="dash" d="M226 286c42 42 74 42 108 0"/>

  <g transform="translate(150 378)">
    <rect class="soft" width="260" height="78" rx="18"/>
    <circle class="deep" cx="42" cy="39" r="23"/>
    <text class="white" x="42" y="46" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="950">1x</text>
    <text class="text label" x="150" y="32" text-anchor="middle">Mint policy</text>
    <text class="text small" x="150" y="58" text-anchor="middle">A note can only be spent once.</text>
  </g>

  <text class="text tiny" x="280" y="493" text-anchor="middle">Less account dependency. Still protected from double spending.</text>
</svg>
