<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Mint operations and treasury policy</title>
  <desc id="desc">A square visual showing mint operations separate from treasury policy, with each Clear Mint Unit carrying its own policy boundary.</desc>
  <defs>
    <style>
      .bg{fill:#f6faf9}
      .card{fill:#fff;stroke:#d5e3e3;stroke-width:5}
      .panel{fill:#fff;stroke:#d5e3e3;stroke-width:4}
      .policy{fill:#fff7f4;stroke:#d9674b;stroke-width:4}
      .ops{fill:#eaf6f7;stroke:#247c93;stroke-width:4}
      .divider{stroke:#d5e3e3;stroke-width:5;stroke-linecap:round}
      .text{font-family:Inter,Arial,sans-serif;fill:#17313a;letter-spacing:0}
      .title{font-size:25px;font-weight:950}
      .label{font-size:22px;font-weight:900}
      .small{font-size:17px;font-weight:850;fill:#63777d}
      .tiny{font-size:15px;font-weight:850;fill:#63777d}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;font-weight:850;fill:#63777d}
      .teal{fill:#247c93}
      .deep{fill:#143d52}
      .coral{fill:#d9674b}
      .white{fill:#fff}
    </style>
  </defs>

  <rect class="bg" width="560" height="560" rx="26"/>
  <rect class="card" x="52" y="46" width="456" height="468" rx="30"/>

  <text class="text title" x="280" y="91" text-anchor="middle">Separate responsibilities</text>

  <g transform="translate(82 125)">
    <rect class="ops" width="185" height="244" rx="18"/>
    <circle class="teal" cx="92" cy="50" r="30"/>
    <path class="white" d="M80 51l10 10 20-25 9 8-29 35-20-20z"/>
    <text class="text label" x="92" y="105" text-anchor="middle">Mint ops</text>
    <text class="text small" x="92" y="142" text-anchor="middle">Runs service</text>
    <text class="text small" x="92" y="172" text-anchor="middle">Protects keys</text>
    <text class="text small" x="92" y="202" text-anchor="middle">Tracks spent state</text>
  </g>

  <path class="divider" d="M280 136v275"/>

  <g transform="translate(293 125)">
    <rect class="policy" width="185" height="244" rx="18"/>
    <circle class="coral" cx="92" cy="50" r="30"/>
    <path class="white" d="M76 45h32v12H76zM91 29h12v44H91z"/>
    <text class="text label" x="92" y="105" text-anchor="middle">Treasury</text>
    <text class="text small" x="92" y="142" text-anchor="middle">Sets policy</text>
    <text class="text small" x="92" y="172" text-anchor="middle">Signs issuance</text>
    <text class="text small" x="92" y="202" text-anchor="middle">Controls CMUs</text>
  </g>

  <g transform="translate(106 398)">
    <rect class="panel" width="348" height="74" rx="16"/>
    <circle class="deep" cx="39" cy="37" r="20"/>
    <text class="white" x="39" y="44" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="950">CMU</text>
    <text class="text small" x="76" y="31">Each CMU has its own policy</text>
    <text class="code" x="76" y="55">cmu-...  -> policy boundary</text>
  </g>
</svg>
